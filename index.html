<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Rey de Reyes Songbook</title>
<meta name="theme-color" content="#0b1120">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Songbook">
<style>
:root{
  --bg:#f5f7fb; --card:#ffffff; --ink:#111827; --muted:#6b7280; --line:#e5e7eb; --soft:#eef2ff;
  --accent:#1d4ed8; --accent-ink:#ffffff; --chord:#c2410c; --warn:#b45309; --warn-bg:#fef3c7; --bad:#b91c1c; --bad-bg:#fee2e2;
  --k-intro:#64748b; --k-verse:#1d4ed8; --k-pre:#7c3aed; --k-chorus:#047857; --k-bridge:#be185d; --k-inst:#0e7490; --k-outro:#64748b;
  --lyric:18px; --radius:14px;
  --mono: ui-monospace, "Cascadia Mono", "Consolas", "Menlo", "Roboto Mono", monospace;
}
html.dark{
  --bg:#0b1120; --card:#131c2e; --ink:#e5e7eb; --muted:#94a3b8; --line:#23304a; --soft:#1a2540;
  --accent:#60a5fa; --accent-ink:#0b1120; --chord:#fb923c; --warn:#fbbf24; --warn-bg:#3a2a07; --bad:#f87171; --bad-bg:#3b1010;
  --k-intro:#94a3b8; --k-verse:#60a5fa; --k-pre:#a78bfa; --k-chorus:#34d399; --k-bridge:#f472b6; --k-inst:#22d3ee; --k-outro:#94a3b8;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
.wrap{max-width:860px;margin:0 auto;padding:0 14px}

/* header */
header.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:10px;height:56px}
.brand{display:flex;flex-direction:column;line-height:1.1;min-width:0;flex:1}
.brand b{font-size:17px}
.brand span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{border:1px solid var(--line);background:var(--card);border-radius:10px;height:38px;min-width:38px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.ibtn svg{width:18px;height:18px}
.ibtn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
nav.tabs{display:flex;gap:4px}
nav.tabs a{padding:8px 12px;border-radius:10px;text-decoration:none;color:var(--muted);font-weight:600;font-size:14px}
nav.tabs a.on{background:var(--soft);color:var(--accent)}

/* bottom bar on phones */
nav.bottom{display:none}
@media (max-width:640px){
  header.top nav.tabs{display:none}
  nav.bottom{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  nav.bottom a{flex:1;text-align:center;padding:9px 0 10px;text-decoration:none;color:var(--muted);font-size:12px;font-weight:600}
  nav.bottom a svg{display:block;margin:0 auto 2px;width:22px;height:22px}
  nav.bottom a.on{color:var(--accent)}
  body main{padding-bottom:calc(var(--navh, 90px) + 28px)}
}

main{padding:14px 0 40px}
.banner{border-radius:12px;padding:10px 12px;margin:0 0 12px;font-size:14px}
.banner.warn{background:var(--warn-bg);color:var(--warn)}
.banner.bad{background:var(--bad-bg);color:var(--bad)}
.card{background:var(--card);border-radius:var(--radius);box-shadow:0 1px 2px rgba(0,0,0,.05);border:1px solid var(--line)}
.muted{color:var(--muted)}
.empty{padding:30px 16px;text-align:center;color:var(--muted)}

/* list */
.search{position:relative;margin-bottom:10px}
.search input{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 40px 0 40px;font-size:16px;outline:none}
.search input:focus{border-color:var(--accent)}
.search svg{position:absolute;left:12px;top:13px;width:20px;height:20px;color:var(--muted)}
.search .x{position:absolute;right:6px;top:6px;width:34px;height:34px;border:0;background:transparent;color:var(--bad);font-size:20px;display:none}
.search.has .x{display:block}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters select,.chip{height:36px;border-radius:999px;border:1px solid var(--line);background:var(--card);padding:0 12px;font-size:14px;flex:0 0 auto}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip.clear{color:var(--bad)}
.count{font-size:13px;color:var(--muted);margin:4px 2px 10px}
.group-h{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:18px 4px 8px}
.songs{display:grid;gap:8px}
.song-row{display:flex;align-items:center;gap:12px;padding:12px 14px;text-decoration:none;color:inherit}
.song-row:hover{border-color:var(--accent)}
.key-badge{flex:0 0 46px;height:46px;border-radius:12px;background:var(--soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px}
.key-badge.none{color:var(--muted);font-weight:600}
.song-row .t{font-weight:650;font-size:16px}
.song-row .s{font-size:13px;color:var(--muted);margin-top:2px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--soft);color:var(--accent);margin-left:6px;vertical-align:1px}
.tag.w{background:var(--warn-bg);color:var(--warn)}
.tag.c{background:rgba(194,65,12,.12);color:var(--chord)}

/* song */
.song-head{padding:16px}
.backrow{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}
.song-head h1{font-size:26px;margin:0 0 8px;line-height:1.15}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.meta span{font-size:13px;background:var(--soft);border-radius:999px;padding:4px 10px}
.meta span b{font-weight:700}
.meta span span{background:none;padding:0;border-radius:0}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tool{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:12px;padding:3px;background:var(--bg)}
.tool .lbl{font-size:12px;color:var(--muted);padding:0 6px}
.tool button{border:0;background:var(--card);border-radius:9px;height:34px;min-width:34px;padding:0 9px;font-weight:700}
.tool button.on{background:var(--accent);color:var(--accent-ink)}
.tool .val{min-width:38px;text-align:center;font-weight:800}
.beat{width:12px;height:12px;border-radius:50%;background:var(--line);margin:0 6px}
.beat.hit{background:var(--accent)}
.beat.hit.one{background:var(--chord)}
.struct{display:flex;gap:6px;overflow-x:auto;padding:12px 16px;border-top:1px solid var(--line);scrollbar-width:none}
.struct::-webkit-scrollbar{display:none}
.struct a{flex:0 0 auto;text-decoration:none;font-size:13px;font-weight:650;padding:5px 10px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.struct a i{font-style:normal;opacity:.6;margin-right:4px}
.sections{display:grid;gap:10px;margin-top:10px}
.sec{padding:12px 16px 14px;scroll-margin-top:70px}
.sec-h{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.sec-h .bar{width:4px;height:18px;border-radius:4px;background:currentColor}
.xb{display:inline-block;font-size:12px;font-weight:800;padding:1px 7px;border-radius:999px;background:var(--soft);color:var(--accent);margin-left:6px;vertical-align:2px;text-transform:none;letter-spacing:0}
.k-intro{color:var(--k-intro)} .k-verse{color:var(--k-verse)} .k-pre{color:var(--k-pre)} .k-chorus{color:var(--k-chorus)}
.k-bridge{color:var(--k-bridge)} .k-inst{color:var(--k-inst)} .k-outro{color:var(--k-outro)} .k-other{color:var(--muted)}
.body{font-size:var(--lyric);line-height:1.45}
.ln{white-space:pre-wrap;word-break:break-word}
.gap{height:.7em}
.mono{font-family:var(--mono);font-size:.86em;white-space:pre;overflow-x:auto}
.pair{margin:.15em 0}
.pair .ly{white-space:pre}
.ch{color:var(--chord);font-weight:700}
.ch-line{font-family:var(--mono);font-size:.86em;white-space:pre-wrap;color:var(--chord);font-weight:700}
.note{font-style:italic;color:var(--muted)}
.echo{color:var(--muted);font-style:italic}
.rep{position:relative;border-left:3px solid var(--accent);padding:2px 0 2px 12px;margin:4px 0}
.rep>.xb{position:absolute;right:0;top:0;margin:0}
.rp{background:var(--soft);border-radius:6px;padding:0 4px}
.rp sup{font-size:.62em;font-weight:800;color:var(--accent);margin-left:2px}
.copied{opacity:.62}
.copied-lbl{font-size:12px;color:var(--muted);font-style:italic;margin-bottom:4px}
.pending{font-size:14px;color:var(--warn);font-style:italic}
.navrow{display:flex;gap:8px;margin-top:14px}
.navrow a{flex:1;padding:12px 14px;text-decoration:none;color:inherit;font-size:14px;min-width:0}
.navrow a small{display:block;color:var(--muted);font-size:12px}
.navrow a b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navrow a.next{text-align:right}
.nolyrics{padding:22px 16px;text-align:center;color:var(--muted)}

/* lists + help */
.block{padding:14px 16px;margin-bottom:12px}
.block h2{font-size:18px;margin:0 0 10px}
.block h3{font-size:15px;margin:14px 0 6px}
.tbl{width:100%;overflow-x:auto}
.tbl table{border-collapse:collapse;min-width:100%;font-size:14px}
.tbl td,.tbl th{border:1px solid var(--line);padding:8px 10px;vertical-align:top;text-align:left}
.tbl tr:first-child td{font-weight:700;background:var(--soft)}
.tbl td div{padding:1px 0}
.block ul,.block ol{margin:4px 0 4px 20px;padding:0}
.block li{margin:3px 0}
.help p,.help li{font-size:15px;line-height:1.5}
.help code,.help pre{font-family:var(--mono);background:var(--soft);border-radius:6px;padding:1px 5px;font-size:13px}
.help pre{padding:10px 12px;white-space:pre;overflow-x:auto}
.miss li{font-size:14px}
.setup{padding:18px}
.setup ol{line-height:1.6}

/* home + events */
.pagehead{display:flex;align-items:center;justify-content:space-between;margin:2px 2px 12px}
.pagehead h2{margin:0;font-size:24px}
.ibtn.primary,.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:12px;height:42px;padding:0 16px;font-weight:700;text-decoration:none;color:var(--ink);font-size:15px}
.btn.small{height:32px;padding:0 10px;font-size:13px;border-radius:9px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.6}
.hero{display:block;text-decoration:none;color:#fff;background:linear-gradient(135deg,#1d4ed8,#2563eb 60%,#3b82f6);border-radius:var(--radius);padding:18px;margin-bottom:12px}
.hero-k{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;opacity:.85}
.hero-t{font-size:24px;font-weight:800;margin:6px 0 4px;line-height:1.15}
.hero-s{font-size:14px;opacity:.9}
.hero-b{display:inline-block;margin-top:14px;background:#fff;color:#1d4ed8;border-radius:10px;padding:8px 14px;font-weight:700;font-size:14px;text-decoration:none}
.week{padding:12px 14px;margin-bottom:12px}
.week-h{font-weight:700;margin-bottom:8px}
.week-row{display:grid;grid-template-columns:repeat(14,minmax(38px,1fr));gap:4px;overflow-x:auto;scrollbar-width:none}
.week-row::-webkit-scrollbar{display:none}
.day{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:10px;text-decoration:none;color:var(--ink)}
.day span{font-size:11px;color:var(--muted)}
.day b{font-size:16px}
.day i{width:6px;height:6px;border-radius:50%;background:transparent}
.day.has i{background:var(--accent)}
.day.today{background:var(--soft)}
.day:hover{background:var(--soft)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.stat{padding:14px 16px;text-decoration:none;color:inherit}
.stat-k{font-weight:700;font-size:14px}
.stat-v{font-size:30px;font-weight:800;margin:6px 0 2px}
.heart-ic{color:#e11d48}
.sec-title{font-size:15px;font-weight:800;margin:18px 2px 8px}
.ev-row,.set-row{display:flex;align-items:center;gap:12px;padding:12px 14px;text-decoration:none;color:inherit}
.ev-row:hover,.set-row:hover{border-color:var(--accent)}
.ev-row .t,.set-row .t{font-weight:700;font-size:16px}
.ev-row .s,.set-row .s{font-size:13px;color:var(--muted);margin-top:2px}
.datebox{flex:0 0 48px;height:50px;border-radius:12px;background:var(--soft);color:var(--accent);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.datebox b{font-size:19px}.datebox span{font-size:11px;font-weight:700;text-transform:uppercase;margin-top:3px}
.chev{color:var(--muted);font-size:20px}
.et{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;margin-right:4px}
.et0{background:#dbeafe;color:#1e40af}.et1{background:#e0e7ff;color:#4338ca}.et2{background:#fce7f3;color:#be185d}.et3{background:#dcfce7;color:#166534}
.et4{background:#fef3c7;color:#92400e}.et5{background:#e5e7eb;color:#374151}.et6{background:#ffedd5;color:#9a3412}.et7{background:#f1f5f9;color:#475569}
html.dark .et{filter:brightness(.85) saturate(1.2)}
.loc{display:inline-flex;align-items:center;gap:5px;font-size:13px;background:var(--soft);border-radius:999px;padding:4px 10px;color:var(--accent);text-decoration:none;font-weight:600}
.loc svg{width:14px;height:14px}
.ev-notes{margin-top:12px;font-size:15px;line-height:1.5;background:var(--bg);border-radius:10px;padding:10px 12px}
.num{flex:0 0 30px;height:30px;border-radius:50%;background:var(--soft);color:var(--accent);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px}
.note-line{font-size:13px;color:var(--chord);margin-top:3px;font-weight:600}
.pills{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.pill{display:inline-block;font-size:12px;font-weight:700;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px 9px;white-space:nowrap}
.evbar{display:flex;align-items:center;gap:10px;padding:10px 14px;margin-bottom:10px;text-decoration:none;color:inherit;border-color:var(--accent)}
.ev-note{padding:10px 14px;margin-bottom:10px;background:var(--warn-bg);color:var(--warn);border-color:transparent;font-size:15px}
.song-row{padding:0;gap:0}
.song-link{display:flex;align-items:center;gap:12px;flex:1;min-width:0;padding:12px 6px 12px 14px;text-decoration:none;color:inherit}
.heart{border:0;background:transparent;font-size:22px;width:44px;height:44px;color:var(--muted);flex:0 0 auto;line-height:1}
.heart.on{color:#e11d48}
.editor label,.song-head>label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-top:12px}
.editor input,.editor select,.editor textarea,.song-head>label input{display:block;width:100%;margin-top:5px;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:0 12px;font-size:16px;color:var(--ink);font-weight:500}
.editor textarea{height:84px;padding:10px 12px;resize:vertical;font-family:inherit}
#selList+.card{margin-top:10px}
.ibtn{font-size:14px;color:var(--ink)}
#pickRes+*{margin-top:0}
.card.song-head+.card.song-head{margin-top:10px}
.row2{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:10px}
@media (max-width:640px){ .row2{grid-template-columns:1fr 1fr} .row2 label:first-child{grid-column:1 / -1} }
.sel-row{display:flex;align-items:center;gap:10px;padding:10px 12px}
.sel-row .t{font-weight:700}
.note-in{width:100%;margin-top:6px;height:36px;border:1px solid var(--line);border-radius:9px;background:var(--bg);padding:0 10px;font-size:14px;color:var(--ink)}
.sel-btns{display:flex;flex-direction:column;gap:4px}
@media (min-width:641px){ .sel-btns{flex-direction:row} }
.sel-btns button{width:34px;height:30px;border:1px solid var(--line);background:var(--card);border-radius:8px;font-weight:700}
.sel-btns button:disabled{opacity:.35}
.sel-btns .rm{color:var(--bad)}
.partbtns{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 8px}
.partbtns .chip{height:32px;font-size:13px}
.editor textarea.lyrics-in{height:320px;font-family:var(--mono);font-size:15px;line-height:1.5;white-space:pre;overflow-x:auto}
.pick-row{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line)}
.pick-row:last-child{border-bottom:0}
.pick-row .s{font-size:12px;color:var(--muted)}

/* floating + button */
.fab{position:fixed;right:20px;bottom:24px;z-index:35;width:58px;height:58px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.25);text-decoration:none}
.fab svg{width:26px;height:26px}
.fab:active{transform:scale(.95)}
body.hasfab main{padding-bottom:110px}
@media (max-width:640px){ body.hasfab main{padding-bottom:calc(var(--navh, 72px) + 100px)} }
@media (max-width:640px){ .fab{bottom:calc(var(--navh, 72px) + 16px)} }
body.stage .fab{display:none !important}
/* countdown */
.countdown{margin-top:14px}
.cd-k{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;opacity:.85;margin-bottom:6px}
.cd-row{display:flex;gap:8px}
.cd-box{flex:1;max-width:96px;background:rgba(255,255,255,.16);border-radius:12px;padding:8px 6px;text-align:center}
.cd-box b{display:block;font-size:26px;font-weight:800;line-height:1.1}
.cd-box span{font-size:12px;opacity:.9}
.cd-now{display:inline-block;background:rgba(255,255,255,.2);border-radius:999px;padding:6px 14px;font-weight:800}
/* v2: simpler song screen, rehearsal mode, guide, leader tools */
.song-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn.big{height:52px;font-size:17px;padding:0 22px;border-radius:14px}
.hero{color:#fff}
.hero-btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.hero-b{display:inline-flex;align-items:center;border:0;background:#fff;color:#1d4ed8;border-radius:12px;padding:10px 16px;font-weight:800;font-size:15px;text-decoration:none;cursor:pointer}
.hero-b.big{font-size:18px;padding:12px 26px}
.hero-b.ghost{background:rgba(255,255,255,.18);color:#fff}
.tip{display:flex;align-items:center;gap:10px;padding:12px 14px;margin-bottom:10px;border-color:var(--accent)}
.xclose{border:0;background:transparent;color:var(--muted);font-size:22px;width:34px;height:34px}
.foot{text-align:center;font-size:13px;color:var(--muted);margin:22px 0 4px}
.foot a{color:var(--muted)}
.players{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.players span{font-size:13px;background:var(--soft);border-radius:999px;padding:4px 10px}
.pill.hl{border-color:var(--accent);color:var(--accent)}
.setnav{display:flex;gap:8px;margin-top:14px}
.snbtn{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;text-decoration:none;color:inherit;min-height:64px}
.snbtn.next{text-align:right;border-color:var(--accent)}
.snbtn.off{visibility:hidden}
.snbtn small{display:block;color:var(--muted);font-size:12px}
.snbtn b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:16px}
body.stage header.top,body.stage nav.bottom{display:none}
body.stage main{padding-top:10px;padding-bottom:calc(var(--stageh, 110px) + 28px)}
body.stage .setnav.fixed{position:fixed;left:0;right:0;bottom:0;margin:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line);z-index:40}
.guide{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;padding:14px}
@media (min-width:641px){ .guide{align-items:center} }
.guide-card{background:var(--card);color:var(--ink);border-radius:20px;padding:20px;max-width:480px;width:100%;font-size:16px;line-height:1.5}
.guide-card h2{margin:6px 0 8px;font-size:22px}
.guide-top{display:flex;justify-content:space-between;align-items:center}
.guide-dots{display:flex;gap:6px;justify-content:center;margin:12px 0}
.guide-dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.guide-dots i.on{background:var(--accent)}
.guide-card .btn.big{width:100%}
.addrow{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.addrow input{flex:1;min-width:120px;height:38px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:0 10px;color:var(--ink);font-size:15px}
.mrow{display:flex;align-items:center;gap:6px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.banner.ok{background:rgba(4,120,87,.15);color:var(--k-chorus)}
.pgrid{display:grid;gap:8px}
.prow{display:flex;align-items:center;gap:10px;font-size:15px}
.prow input[type=checkbox]{width:20px;height:20px}
.prow b{min-width:90px}
.prow .note-in{margin:0;flex:1}
.sel-in{display:flex;gap:6px;margin-top:6px}
.sel-in .key-in{height:36px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);padding:0 6px;font-size:14px;max-width:110px}
.sel-in .note-in{margin:0}
.partbtns{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 8px}
.partbtns .chip{height:32px;font-size:13px}
.editor textarea.lyrics-in{height:320px;font-family:var(--mono);font-size:15px;line-height:1.5;white-space:pre;overflow-x:auto}
@media (max-width:640px){ .song-head h1{font-size:24px} }

/* ===== calm minimalist look (v3) ===== */
:root{
  --bg:#ffffff; --card:#f6f7f9; --ink:#1f2328; --muted:#6b7280; --line:#eceef2; --soft:#f0f2f5;
  --accent:#2f7cf6; --accent-ink:#ffffff; --chord:#d9480f;
  --t-blue:#eef4ff; --t-pink:#fdf0f0; --t-cream:#fff6e5; --t-green:#ecf8f1;
  --radius:18px;
}
html.dark{
  --bg:#0e1013; --card:#171a1f; --ink:#e8eaed; --muted:#98a1ad; --line:#252a31; --soft:#1f232a;
  --accent:#5b9bff; --accent-ink:#0e1013; --chord:#ff9a5a;
  --t-blue:rgba(91,155,255,.13); --t-pink:rgba(248,113,113,.11); --t-cream:rgba(251,191,36,.10); --t-green:rgba(52,211,153,.10);
}
body{font-weight:400;letter-spacing:.005em}
.card{border:0;box-shadow:none;background:var(--card);border-radius:var(--radius)}
header.top{background:var(--bg);border-bottom:0}
header.top .wrap{height:64px}
.brand b{font-size:19px;font-weight:600}
.brand span{font-size:12px}
.ibtn{border:0;background:var(--soft);border-radius:999px;min-width:40px;height:40px;font-weight:500}
.ibtn.primary{background:var(--accent);color:var(--accent-ink)}
nav.tabs{gap:18px;margin-right:8px}
nav.tabs a{padding:20px 2px 18px;border-radius:0;font-weight:500;color:var(--muted)}
nav.tabs a.on{background:none;color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent);font-weight:600}
@media (max-width:640px){
  nav.bottom{border-top:1px solid var(--line);background:var(--bg)}
  nav.bottom a{font-weight:500}
  nav.bottom a svg{stroke-width:1.8}
}
.pagehead h2{font-weight:600;font-size:22px}
.sec-title{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);margin:22px 2px 12px}
.ic{width:20px;height:20px}
.ic.sm{width:18px;height:18px}
.band{height:10px;background:var(--soft);margin:22px -14px 0}
.band + .sec-title{margin-top:20px}
/* home dashboard */
.dash{display:grid;grid-template-columns:1.25fr 1fr;gap:12px}
.dash-side{display:grid;gap:12px}
@media (max-width:640px){ .dash{grid-template-columns:1fr} .dash-side{grid-template-columns:1fr 1fr} }
.hero{background:var(--t-blue);color:var(--ink);border-radius:var(--radius);padding:20px;margin:0}
.hero-k{font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--muted);opacity:1}
.hero-t{font-size:24px;font-weight:600;margin:6px 0 4px}
.hero-s{font-size:14px;color:var(--muted);opacity:1}
.hero-b{background:var(--accent);color:var(--accent-ink);font-weight:600;border-radius:12px}
.hero-b.ghost{background:var(--bg);color:var(--ink)}
.cd-k{color:var(--muted);opacity:1;font-weight:600}
.cd-box{background:var(--bg)}
.cd-box b{font-weight:600}
.cd-box span{color:var(--muted)}
.cd-now{background:var(--bg)}
.tile{position:relative;display:block;border-radius:var(--radius);padding:18px;text-decoration:none;color:var(--ink);min-height:96px}
.tile.t-pink{background:var(--t-pink)} .tile.t-cream{background:var(--t-cream)}
.tile-v{font-size:26px;font-weight:600}
.tile-k{font-size:14px;color:var(--muted);margin-top:6px}
.tile-go{position:absolute;top:14px;right:16px;font-size:22px;color:var(--muted)}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;text-align:center}
.qtile{display:flex;flex-direction:column;align-items:center;gap:8px;text-decoration:none;color:var(--ink);font-size:14px;line-height:1.25}
.qicon{width:64px;height:64px;border-radius:16px;background:var(--card);display:flex;align-items:center;justify-content:center;color:var(--accent)}
.qicon .ic{width:26px;height:26px}
.week{background:none;padding:0;margin:0}
.day{border-radius:12px}
.day.today{background:var(--t-blue);color:var(--accent)}
.day b{font-weight:600}
.foot{margin-top:28px}
/* lists: one soft block with thin lines between rows */
.songs{gap:0;background:var(--card);border-radius:var(--radius);overflow:hidden}
.songs > .card{background:transparent;border-radius:0;border-bottom:1px solid var(--line)}
.songs > .card:last-child{border-bottom:0}
.song-row .t,.ev-row .t,.set-row .t{font-weight:500}
.group-h{font-size:12px;font-weight:600;letter-spacing:.08em;margin:22px 4px 10px}
.key-badge,.datebox{background:var(--t-blue)}
.datebox b{font-weight:600}
.num{background:var(--t-blue);font-weight:600}
.pill{background:var(--soft);border:0;font-weight:500}
.pill.hl{background:var(--t-blue);color:var(--accent)}
.tag{font-weight:600}
.chip,.filters select{border:0;background:var(--soft);font-weight:500}
.chip.on{background:var(--accent);color:var(--accent-ink)}
.search input{border:0;background:var(--soft);border-radius:14px}
.tip{border:0;background:var(--t-cream)}
.banner{border-radius:14px}
/* song + event pages */
.song-head h1{font-weight:600}
.meta span,.loc{background:var(--soft);font-weight:400}
.struct{border-top:1px solid var(--line)}
.struct a{border-width:1px;font-weight:500}
.sec{background:var(--card)}
.sec-h{font-weight:600;letter-spacing:.06em}
.tool{border:0;background:var(--soft)}
.tool button{background:var(--bg);font-weight:600}
.evbar{border:0;background:var(--t-blue)}
.ev-note{background:var(--t-cream)}
.ev-notes{background:var(--bg)}
.snbtn{border:0;background:var(--card)}
.snbtn.next{background:var(--t-blue)}
.btn{border:0;background:var(--soft);font-weight:600}
.btn.danger{background:var(--t-pink);color:var(--bad)}
.editor input,.editor select,.editor textarea,.song-head>label input,.note-in,.addrow input,.sel-in .key-in{border:0;background:var(--bg)}
.sel-btns button{border:0;background:var(--bg)}
.block{background:var(--card)}
.mrow{border-top-color:var(--line)}
.heart{color:var(--muted)}
</style>
</head>

<script>
/* ====================== SETTINGS ====================== */
// Link of the Apps Script web app that reads the Google Doc (ends in /exec). See README.
var SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzAqUte8NfSg7W6wguzxa0yRKISyu8Hc_PPsLpTZg3zKFvjg2olXJgKoLPa4keAmIe4zg/exec";
// The band's song document (only used for the "Open the song doc" link on the Help page).
var DOC_URL = "https://docs.google.com/document/d/1h71apax-e4iVCXoxrhq3wtUltAUcRPk51wqIVKMSCT0/edit";
// Re-read the document when the app is opened again after this many minutes.
var REFRESH_MINUTES = 5;

<script>
/* ====================== CORE (no screen code; tested on its own) ====================== */
/* CORE-START */
var NOTES_S = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
var NOTES_F = ["C","Db","D","Eb","E","F","Gb","G","Ab","A","Bb","B"];
var NOTE_IDX = {"C":0,"C#":1,"Db":1,"D":2,"D#":3,"Eb":3,"E":4,"Fb":4,"E#":5,"F":5,"F#":6,"Gb":6,"G":7,"G#":8,"Ab":8,"A":9,"A#":10,"Bb":10,"B":11,"Cb":11,"B#":0};
var CHORD_BODY = "[A-G](?:#|b)?(?:maj|min|m|M|dim|aug|sus|add|º|°)?\\d*(?:(?:sus|add|maj|b|#)\\d+)*(?:\\/[A-G](?:#|b)?)?";
var CHORD_RE = new RegExp("^" + CHORD_BODY + "$");
var CHORD_G = new RegExp("(^|[^A-Za-z#])(" + CHORD_BODY + ")(?![A-Za-z#])", "g");

function norm(s){ return String(s||"").replace(/&/g," y ").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[’'`´]/g,"").replace(/[^a-z0-9#]+/g," ").trim(); }
function slug(s){ return norm(s).replace(/#/g,"").replace(/\s+/g,"-") || "cancion"; }
function expandTabs(s){ return String(s).replace(/\t/g,"    "); }

function isChordLine(line){
  var s = expandTabs(line).trim(); if(!s) return false;
  var toks = s.split(/[\s\-–—|,]+/), n = 0;
  for (var i=0;i<toks.length;i++){
    var c = toks[i].replace(/^[\[\(\/:]+|[\]\)\/:.]+$/g,"");
    if(!c) continue;
    if(/^x\d+$/i.test(c)) continue;
    if(!CHORD_RE.test(c)) return false;
    n++;
  }
  return n > 0;
}

function transposeChord(ch, n, flats){
  var m = ch.match(/^([A-G][#b]?)(.*?)(?:\/([A-G][#b]?))?$/);
  if(!m || NOTE_IDX[m[1]] === undefined) return ch;
  var names = flats ? NOTES_F : NOTES_S;
  var r = names[(NOTE_IDX[m[1]] + n + 1200) % 12];
  var b = m[3] ? "/" + names[(NOTE_IDX[m[3]] + n + 1200) % 12] : "";
  return r + m[2] + b;
}
// key text like "G / SOL mayor", "E Major", "Am" -> {root:"G", minor:false} or null
function parseKey(k){
  var m = String(k||"").trim().match(/^([A-G])\s*([#b♯♭])?\s*(m(?!aj|ayor)|min|minor|menor)?/i);
  if(!m || !/[A-G]/.test(m[1])) return null;
  var acc = m[2] ? (m[2]==="♯"?"#":m[2]==="♭"?"b":m[2]) : "";
  var minor = !!m[3] || /\bmenor\b|\bminor\b/i.test(k);
  return { root: m[1].toUpperCase() + acc, minor: minor };
}
function keyName(k, n){
  if(!k) return "";
  var flats = useFlats(k, n);
  return transposeChord(k.root, n, flats) + (k.minor ? "m" : "");
}
function useFlats(k, n){
  if(!k) return false;
  var idx = (NOTE_IDX[k.root] + (n||0) + 1200) % 12;
  // keys that are normally written with flats
  var flatMajor = {5:1,10:1,3:1,8:1,1:1};        // F Bb Eb Ab Db
  var flatMinor = {2:1,7:1,0:1,5:1,10:1,3:1};    // Dm Gm Cm Fm Bbm Ebm
  return k.minor ? !!flatMinor[idx] : !!flatMajor[idx];
}
// transpose every chord in a chord line, keeping chords lined up over the words when possible
function transposeLine(line, n, flats){
  line = expandTabs(line);
  if(!n) return line;
  var out = "", carry = 0, last = 0, m;
  CHORD_G.lastIndex = 0;
  while((m = CHORD_G.exec(line))){
    var start = m.index + m[1].length;
    var gap = line.slice(last, start);
    if(carry > 0 && /^ +$/.test(gap) && gap.length > 1){ var cut = Math.min(carry, gap.length-1); gap = gap.slice(cut); carry -= cut; }
    else if(carry < 0 && /^ +$/.test(gap)){ gap += new Array(-carry+1).join(" "); carry = 0; }
    var t = transposeChord(m[2], n, flats);
    carry += t.length - m[2].length;
    out += gap + t;
    last = start + m[2].length;
    CHORD_G.lastIndex = last;
  }
  return out + line.slice(last);
}

var SEC_RE = /^(intro(?:ducci[oó]n)?|pre[\s-]?coro|pre[\s-]?chorus|verso|verse|estrofa|coro|chorus|estribillo|puente|bridge|interludio|interlude|instrumental|drum solo|solo de bateria|outro|final|cierre|tag|vamp)(?![a-z])\s*((?:[IVX]+|\d+)(?![a-z]))?\s*(.*)$/i;
function sectionKind(w){
  w = norm(w);
  if(/^intro/.test(w)) return "intro";
  if(/^pre/.test(w)) return "pre";
  if(/^(verso|verse|estrofa)/.test(w)) return "verse";
  if(/^(coro|chorus|estribillo)/.test(w)) return "chorus";
  if(/^(puente|bridge)/.test(w)) return "bridge";
  if(/^(instrumental|interlud|drum|solo)/.test(w)) return "inst";
  if(/^(outro|final|cierre|tag|vamp)/.test(w)) return "outro";
  return "other";
}
function parseHeader(line){
  var s = String(line||"").trim();
  if(!s || s.length > 48) return null;
  var m = s.match(SEC_RE);
  if(!m) return null;
  var rest = m[3] || "";
  if(rest && !/^[\(\-–—:\[]/.test(rest)) return null;
  var reps = 0, rm = rest.match(/\(\s*x\s*(\d+)\s*\)|\bx\s*(\d+)\b/i);
  if(rm){ reps = parseInt(rm[1]||rm[2],10); rest = rest.replace(rm[0],"").trim(); }
  rest = rest.replace(/^[\-–—:]\s*/,"").trim();
  var kind = sectionKind(m[1]);
  var num = m[2] ? m[2].toUpperCase() : "";
  var arab = {"1":"I","2":"II","3":"III","4":"IV","5":"V"}; if(arab[num]) num = arab[num];
  var label = (m[1] + (m[2] ? " " + m[2] : "")).replace(/\s+/g," ");
  label = label.charAt(0).toUpperCase() + label.slice(1);
  return { label: label, note: rest.replace(/^\((.*)\)$/,"$1"), reps: reps, kind: kind, key: kind + "|" + num };
}

var META_RE = { type:/^(type|tipo)/, artist:/^(artist|artista|autor|cover)/, key:/^(key|tono|tonalidad)/, tempo:/^(tempo|bpm|velocidad)/, genre:/^(genre|genero|ritmo|estilo)/, instruments:/^instrument/ };
function metaLabel(s){ var n = norm(s); for(var k in META_RE) if(META_RE[k].test(n)) return k; return null; }
function isMetaTable(b){
  if(!b || b.t !== "table" || !b.rows || !b.rows.length) return false;
  var hits = 0;
  b.rows.forEach(function(r){ if(r && r.length && metaLabel(r[0])) hits++; });
  return hits >= 2 || (hits >= 1 && b.rows.length === 1);
}
function parseMeta(rows){
  var m = {};
  rows.forEach(function(r){
    for(var i=0;i<r.length;i+=2){
      var k = metaLabel(r[i]); var v = (splitLines(r[i+1]).filter(function(x){ return x.trim() && !parseHeader(x); })[0] || "").replace(/\s+/g," ").trim();
      if(k && v && !m[k]) m[k] = v;
    }
  });
  var bpm = null, time = null;
  if(m.tempo){
    var b = m.tempo.match(/(\d+)\s*bpm/i) || m.tempo.match(/^(\d+)/);
    if(b && parseInt(b[1],10) > 0) bpm = parseInt(b[1],10);
    var t = m.tempo.match(/(\d+)\s*\/\s*(\d+)/); if(t) time = t[1] + "/" + t[2];
  }
  m.bpm = bpm; m.time = time;
  return m;
}
function splitLines(text){ return String(text==null?"":text).replace(/\r\n?/g,"\n").replace(/\u000b/g,"\n").split("\n"); }
function textOf(b){ return b.t === "table" ? b.rows.map(function(r){return r.join(" | ");}).join("\n") : String(b.text||""); }
function isBlankP(b){ return (b.t === "p" || b.t === "li") && !String(b.text||"").trim(); }

function looksLikeTitle(bl, i){
  var b = bl[i];
  if(!b || (b.t !== "p" && b.t !== "li")) return -1;
  var t = String(b.text||"").trim();
  if(!t || t.length > 80 || parseHeader(t) || metaLabel(t)) return -1;
  for(var j=i+1;j<bl.length && j<=i+4;j++){
    if(isBlankP(bl[j])) continue;
    return isMetaTable(bl[j]) ? j : -1;
  }
  return -1;
}

function buildSections(lines){
  var secs = [], cur = null;
  function push(l){
    if(!cur){ cur = { label:"", note:"", reps:0, kind:"other", key:"other|", lines:[] }; secs.push(cur); }
    cur.lines.push(l);
  }
  lines.forEach(function(raw){
    var l = String(raw).replace(/\s+$/,"");
    var h = parseHeader(l);
    if(h){ h.lines = []; cur = h; secs.push(h); return; }
    push(l);
  });
  secs.forEach(function(s){
    var out = [], prevBlank = true;
    s.lines.forEach(function(l){ var b = !l.trim(); if(b && prevBlank) return; out.push(l); prevBlank = b; });
    while(out.length && !out[out.length-1].trim()) out.pop();
    s.lines = out;
  });
  secs = secs.filter(function(s){ return s.label || s.lines.length; });
  // empty sections repeat an earlier one with the same name
  var seen = {};
  secs.forEach(function(s){
    if(s.lines.length){ if(!seen[s.key]) seen[s.key] = s; }
    else if(seen[s.key] && s.kind !== "inst" && s.kind !== "intro" && s.kind !== "outro"){ s.copyOf = seen[s.key]; }
  });
  return secs;
}

function parseDoc(data){
  var songs = [], lists = [], groups = [], used = {};
  (data.tabs || []).forEach(function(tab, ti){
    var bl = tab.blocks || [], cur = null, tabSongs = [], extra = [], listMode = null, tabLists = [];
    for(var i=0;i<bl.length;i++){
      var b = bl[i];
      var tj = looksLikeTitle(bl, i);
      if(tj >= 0){
        var title = String(b.text).replace(/\s+/g," ").trim();
        var id = slug(title), k = 2; while(used[id]) id = slug(title) + "-" + (k++); used[id] = 1;
        cur = { id:id, title:title, group:tab.title || ("Part " + (ti+1)), groupIdx:ti, order:songs.length, meta:parseMeta(bl[tj].rows), raw:[] };
        tabSongs.push(cur); songs.push(cur); listMode = null;
        i = tj; continue;
      }
      if(b.t === "hr" || b.t === "toc" || (b.t === "p" && /^\s*[_\-─—=]{8,}\s*$/.test(b.text||""))){ cur = null; continue; }
      if(b.t === "p" && /^\s*(set ?lists?|listas?|playlists?|setlists?)\s*$/i.test(b.text||"")){ cur = null; listMode = { title: String(b.text).trim(), blocks: [] }; tabLists.push(listMode); continue; }
      if(listMode){ listMode.blocks.push(b); continue; }
      if(cur){ splitLines(textOf(b)).forEach(function(l){ cur.raw.push(l); }); }
      else extra.push(b);
    }
    tabLists.forEach(function(l){ if(l.blocks.length) lists.push(l); });
    if(tabSongs.length) groups.push(tabSongs[0].group);
    else if(extra.some(function(b){ return b.t === "table" || (b.t !== "hr" && String(b.text||"").trim()); })) lists.push({ title: tab.title || ("Part " + (ti+1)), blocks: extra });
  });
  songs.forEach(function(s){
    var m = s.meta;
    s.key = parseKey(m.key);
    s.keyText = m.key || "";
    s.bpm = m.bpm; s.time = m.time;
    s.genre = m.genre || "";
    s.artist = m.artist || "";
    var ours = /^(rey de reyes|rdr|rohi)\b/i.test(norm(s.artist));
    s.type = /cover/i.test(m.type||"") ? "Cover" : /original/i.test(m.type||"") ? "Original" : (s.artist && !ours ? "Cover" : "Original");
    s.ours = ours;
    s.sections = buildSections(s.raw);
    s.hasChords = s.raw.some(isChordLine);
    s.hasLyrics = s.sections.some(function(x){
      return x.kind !== "inst" && x.kind !== "intro" && x.lines.some(function(l){ return l.trim() && !isChordLine(l) && !/^\(.*\)$/.test(l.trim()); });
    });
    s.search = norm(s.title + " " + s.artist + " " + s.genre + " " + s.raw.join(" "));
    s.titleN = norm(s.title);
    delete s.raw;
  });
  return { songs: songs, lists: lists, groups: groups, tabsAll: (data.tabs || []).map(function(t){ return { title: t.title || "", parent: t.parent || "" }; }), name: data.name || "", updated: data.updated || "" };
}

// match a line from a set list ("2. Si supieras [D]") to a song
function cleanListItem(s){
  return String(s||"").replace(/^\s*(\d+[\.\)]|[\*\-•])\s*/,"").replace(/\s*[\[\(][^\]\)]*[\]\)]?\s*$/,"").trim();
}
function findSong(songs, text){
  var n = norm(cleanListItem(text)); if(!n) return null;
  for(var i=0;i<songs.length;i++) if(songs[i].titleN === n) return songs[i];
  var best = null;
  for(var j=0;j<songs.length;j++){
    var t = songs[j].titleN;
    if(t.length >= 6 && (n + " ").indexOf(t + " ") === 0 && (!best || t.length > best.titleN.length)) best = songs[j];
  }
  return best;
}
// the band database (Google Sheet) -> songs ready to show
function parseDb(raw){
  var songs = (raw.songs || []).map(function(r){
    var s = { id: r.id, title: String(r.title || ""), album: r.album || "", type: /cover/i.test(r.type || "") ? "Cover" : "Original", artist: r.artist || "",
              keyText: r.key || "", key: parseKey(r.key), bpm: parseInt(r.bpm, 10) || null, time: r.time || "", genre: r.genre || "", link: r.link || "", lyrics: String(r.lyrics || "") };
    s.group = s.album || (s.type === "Cover" ? "Covers" : "No album");
    var lines = splitLines(s.lyrics);
    s.sections = buildSections(lines);
    s.hasChords = lines.some(isChordLine);
    s.hasLyrics = s.sections.some(function(x){ return x.kind !== "inst" && x.kind !== "intro" && x.lines.some(function(l){ return l.trim() && !isChordLine(l) && !/^\(.*\)$/.test(l.trim()); }); });
    s.search = norm(s.title + " " + s.artist + " " + s.genre + " " + s.album + " " + s.lyrics);
    s.titleN = norm(s.title);
    return s;
  });
  var albums = (raw.albums || []).map(function(a){ return { name: a.name, year: a.year || "" }; });
  var groups = [], seen = {};
  function add(g){ if(g && !seen[g] && songs.some(function(s){ return s.group === g; })){ seen[g] = 1; groups.push(g); } }
  albums.forEach(function(a){ add(a.name); });
  songs.forEach(function(s){ if(s.album) add(s.album); });
  add("Covers"); add("No album");
  function abc(a, b){ return norm(a) < norm(b) ? -1 : 1; }
  return { songs: songs, groups: groups, albums: albums, artists: (raw.artists || []).slice().sort(abc), genres: (raw.genres || []).slice().sort(abc), members: raw.members || [] };
}
/* CORE-END */
</script>

<script>
/* ====================== SCREEN ====================== */
(function(){
var LS = "cancionero.";
function ls(k, v){ try{ if(v === undefined){ var x = localStorage.getItem(LS+k); return x == null ? null : JSON.parse(x); } localStorage.setItem(LS+k, JSON.stringify(v)); }catch(e){ return null; } }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

/* theme */
function setTheme(t){ document.documentElement.classList.toggle("dark", t === "dark"); ls("theme", t); document.querySelector('meta[name="theme-color"]').content = t === "dark" ? "#0b1120" : "#1d4ed8"; }

/* ---------- talking to the Google script ---------- */
function jsonp(url, ms){
  return new Promise(function(res, rej){
    var name = "cb_" + Date.now() + "_" + Math.floor(Math.random()*1e6);
    var tag = document.createElement("script"), done = false;
    var timer = setTimeout(function(){ finish(); rej(new Error("timeout")); }, ms || 30000);
    function finish(){ done = true; clearTimeout(timer); try{ delete window[name]; }catch(e){ window[name] = undefined; } if(tag.parentNode) tag.parentNode.removeChild(tag); }
    window[name] = function(d){ if(done) return; finish(); res(d); };
    tag.onerror = function(){ if(done) return; finish(); rej(new Error("network")); };
    tag.src = url + (url.indexOf("?") >= 0 ? "&" : "?") + "callback=" + name + "&_=" + Date.now();

// long data (lyrics) goes in pieces, because a web link can only be so long
function send(action, pin, obj){

  function next(){
    if(i >= n) return jsonp(SCRIPT_URL + "?action=" + action + "&pin=" + encodeURIComponent(pin) + "&key=" + key, 45000);
    var idx = i++;
    return jsonp(SCRIPT_URL + "?action=part&pin=" + encodeURIComponent(pin) + "&key=" + key + "&i=" + idx + "&n=" + n + "&chunk=" + encodeURIComponent(str.slice(idx*size, (idx+1)*size)), 30000)

}
function useData(raw, source, when){

}

/* ---------- routing ---------- */
function route(){

  var view = "home", arg = "", arg2 = "";

/* ---------- leader sign-in (only the leader sees the edit buttons) ---------- */

    }).catch(function(){ b.disabled = false; b.textContent = "Sign in"; $("lgMsg").innerHTML = '<div class="banner bad" style="margin:10px 0 0">No internet. Try again.</div>'; });

/* ---------- songs list ---------- */
function filtered(){

    return true;
  });
}
function byTitle(a,b){ return a.titleN < b.titleN ? -1 : a.titleN > b.titleN ? 1 : 0; }
function keyLabel(k){ return k ? keyName(k, 0).replace(/m$/, "") + (k.minor ? " Minor" : " Major") : ""; }
function songRow(s){
  var bits = [];

    '<button class="heart' + (state.saved[s.id] ? ' on' : '') + '" data-heart="' + esc(s.id) + '" aria-label="Save song">' + (state.saved[s.id] ? '♥' : '♡') + '</button></div>';

    '<div class="search' + (state.q ? ' has' : '') + '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>' +
    '<input id="q" type="search" placeholder="Search by title or lyrics" autocomplete="off" value="' + esc(state.q) + '"><button class="x" id="qx" aria-label="Clear">×</button></div>' +
    '<div class="filters">' +
      '<button class="chip' + (state.onlySaved ? ' on' : '') + '" id="fSaved">♥ Saved</button>' +
      (db.groups.length > 1 ? '<select id="fGroup"><option value="">All albums</option>' + db.groups.map(function(g){ return '<option' + (g === state.group ? ' selected' : '') + '>' + esc(g) + '</option>'; }).join("") + '</select>' : '') +
      '<button class="chip' + (state.type === "Original" ? ' on' : '') + '" data-type="Original">Originals</button>' +
      '<button class="chip' + (state.type === "Cover" ? ' on' : '') + '" data-type="Cover">Covers</button>' +
      (gkeys.length ? '<select id="fGenre"><option value="">All genres</option>' + gkeys.map(function(k){ return '<option value="' + esc(k) + '"' + (k === state.genre ? ' selected' : '') + '>' + esc(genres[k]) + '</option>'; }).join("") + '</select>' : '') +
      '<button class="chip' + (state.onlyLyrics ? ' on' : '') + '" id="fLyr">Has lyrics</button>' +
      (nFilters ? '<button class="chip clear" id="fClear">Clear (' + nFilters + ')</button>' : '') +
    '</div>';
  var order = [];

  else db.groups.forEach(function(g){

  });
  state.lastList = order.map(function(s){ return s.id; });

  $("qx").onclick = function(){ state.q = ""; ls("q",""); renderList(banner); };

  $("fLyr").onclick = function(){ state.onlyLyrics = !state.onlyLyrics; ls("onlyLyrics", state.onlyLyrics); renderList(banner); };

  document.querySelectorAll("[data-heart]").forEach(function(b){ b.onclick = function(ev){ ev.preventDefault(); toggleSaved(b.getAttribute("data-heart")); renderList(banner); }; });
}
function toggleSaved(id){ if(state.saved[id]) delete state.saved[id]; else state.saved[id] = 1; ls("saved", state.saved); }

/* ---------- one song ---------- */
function chordHtml(line){ return esc(line).replace(CHORD_G, function(all, pre, ch){ return pre + '<span class="ch">' + ch + '</span>'; }); }
function lyricHtml(text){
  var h = esc(text);

/* ---------- countdown to the next event ---------- */
function evStart(e){ var d = evDate(e); if(!d) return null; if(e.time){ var p = e.time.split(":"); d.setHours(+p[0], +p[1], 0, 0); } return d; }
function startCountdown(e){
  if(state.cdTimer) clearInterval(state.cdTimer);
  function tick(){
    var el = $("cd"); if(!el){ clearInterval(state.cdTimer); state.cdTimer = null; return; }
    var start = evStart(e); if(!start){ el.innerHTML = ""; return; }
    var ms = start - new Date();
    if(ms <= 0){ el.innerHTML = '<div class="cd-now">' + (e.time ? 'Happening now' : 'Today') + '</div>'; return; }
    var mins = Math.floor(ms / 60000), d = Math.floor(mins / 1440), h = Math.floor((mins % 1440) / 60), m = mins % 60;
    function box(n, word){ return '<div class="cd-box"><b>' + n + '</b><span>' + word + (n === 1 ? '' : 's') + '</span></div>'; }
    el.innerHTML = '<div class="cd-k">Time left to practice</div><div class="cd-row">' + box(d, "day") + box(h, "hour") + box(m, "minute") + '</div>';
  }
  tick();
  state.cdTimer = setInterval(tick, 30000);
}

    '<label>Location<input id="fLoc" maxlength="150" value="' + esc(d.location || "") + '" placeholder="e.g. Rey de Reyes church, San Antonio"></label>' +

    document.querySelectorAll("[data-down]").forEach(function(x){ x.onclick = function(){ var i = +x.getAttribute("data-down"), t = d.songs[i+1]; d.songs[i+1] = d.songs[i]; d.songs[i] = t; drawSel(); }; });
    document.querySelectorAll("[data-rm]").forEach(function(x){ x.onclick = function(){ d.songs.splice(+x.getAttribute("data-rm"), 1); drawSel(); drawPick(); }; });

  var keyOpts = '<option value="">(not sure yet)</option>' + KEYS.map(function(k){ return '<option' + (d.key === k ? ' selected' : '') + '>' + k + '</option>'; }).join("") + KEYS.map(function(k){ return '<option' + (d.key === k + "m" ? ' selected' : '') + '>' + k + 'm</option>'; }).join("");
  var h = banner + '<div class="card song-head editor">' +
    '<div class="backrow"><a class="ibtn" href="' + (id ? '#/c/' + encodeURIComponent(id) : '#/songs') + '" style="text-decoration:none">‹ Cancel</a><span class="muted" style="font-size:13px">' + (id ? 'Edit song' : 'New song') + '</span></div>' +
    '<label>Song title<input id="sTitle" maxlength="100" value="' + esc(d.title) + '"></label>' +
    '<div class="row2"><label>Album<select id="sAlbum">' + opts(db.albums.map(function(a){ return a.name; }), d.album, "(no album)") + '</select></label>' +
    '<label>Type<select id="sType"><option' + (d.type === "Original" ? ' selected' : '') + '>Original</option><option' + (d.type === "Cover" ? ' selected' : '') + '>Cover</option></select></label>' +
    '<label>Artist<select id="sArtist">' + opts(db.artists, d.artist, "(choose)") + '</select></label></div>' +
    '<div class="row2"><label>Key<select id="sKey">' + keyOpts + '</select></label>' +
    '<label>Tempo (BPM)<input id="sBpm" type="number" inputmode="numeric" min="30" max="250" value="' + esc(d.bpm) + '" placeholder="e.g. 100"></label>' +
    '<label>Time<select id="sTime">' + ["4/4","3/4","2/2","6/8","2/4","12/8"].map(function(t){ return '<option' + (d.time === t ? ' selected' : '') + '>' + t + '</option>'; }).join("") + '</select></label></div>' +
    '<div class="row2"><label>Genre<select id="sGenre">' + opts(db.genres, d.genre, "(choose)") + '</select></label>' +
    '<label style="grid-column:span 2">Practice link (YouTube or audio)<input id="sLink" type="url" maxlength="500" value="' + esc(d.link) + '" placeholder="https://youtube.com/..."></label></div>' +
    '<label>Lyrics</label><div class="partbtns">' + PARTS.map(function(p){ return '<button class="chip" data-part="' + esc(p) + '">+ ' + esc(p) + '</button>'; }).join("") + '</div>' +
    '<textarea id="sLyrics" class="lyrics-in" spellcheck="false" placeholder="Intro\n[G] - [C] - [D]\n\nVerso I\nFirst line\n//These two lines\nare sung twice//\n\nCoro (x2)\n...">' + esc(d.lyrics) + '</textarea>' +
    '<div class="muted" style="font-size:12px;margin-top:6px">Part names on their own line. <b>//</b> around lines = sing twice, <b>///</b> = three times. Chords on their own line like [D] - [Bm], or above the words.</div></div>' +
    '<div class="sec-title">Preview</div><div id="sPrev"></div>' +
    '<div class="card song-head" style="margin-top:10px"><div id="sMsg"></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" id="sSave">' + (id ? 'Save changes' : 'Add song') + '</button>' + (id ? '<button class="btn danger" id="sDel">Delete song</button>' : '') + '</div></div>';
  $("app").innerHTML = h;
  function bind(i, k){ $(i).oninput = $(i).onchange = function(){ d[k] = this.value; if(k === "lyrics" || k === "key") drawPrev(); }; }
  bind("sTitle","title"); bind("sKey","key"); bind("sBpm","bpm"); bind("sTime","time"); bind("sLink","link"); bind("sLyrics","lyrics");
  function pickNew(sel, k, what){
    $(sel).onchange = function(){
      if(this.value === "__new"){
        var v = (prompt("New " + what + " name:") || "").trim();
        if(v){ d[k] = v; renderSongEditor(id, banner); } else this.value = d[k] || "";
      } else d[k] = this.value;
    };
  }
  pickNew("sAlbum", "album", "album"); pickNew("sArtist", "artist", "artist"); pickNew("sGenre", "genre", "genre");
  $("sType").onchange = function(){ d.type = this.value; if(d.type === "Cover" && d.artist === "Rey de Reyes Band"){ d.artist = ""; renderSongEditor(id, banner); } else if(d.type === "Original" && !d.artist){ d.artist = "Rey de Reyes Band"; renderSongEditor(id, banner); } };
  document.querySelectorAll("[data-part]").forEach(function(b){ b.onclick = function(){
    var ta = $("sLyrics"), p = b.getAttribute("data-part"), at = ta.selectionStart || ta.value.length, before = ta.value.slice(0, at), after = ta.value.slice(at);
    var ins = (before && !/\n\n$/.test(before) ? (/\n$/.test(before) ? "\n" : "\n\n") : "") + p + "\n";
    ta.value = before + ins + after; d.lyrics = ta.value; ta.focus(); var pos = (before + ins).length; ta.setSelectionRange(pos, pos); drawPrev();
  }; });
  function drawPrev(){
    var secs = buildSections(splitLines(d.lyrics)), k = parseKey(d.key);
    $("sPrev").innerHTML = d.lyrics.trim() ? sectionsHtml(secs, 0, k ? useFlats(k, 0) : false, true) : '<div class="card empty" style="padding:16px">Type the lyrics above to see how the band will see them.</div>';
  }
  drawPrev();
  function msg(t){ $("sMsg").innerHTML = t ? '<div class="banner bad" style="margin:0 0 10px">' + t + '</div>' : ''; }
  $("sSave").onclick = function(){
    var b = this;
    if(!d.title.trim()) return msg("Give the song a title.");
    if(db.songs.some(function(x){ return x.id !== d.id && x.titleN === norm(d.title); })) return msg("Another song already has that title.");
    b.disabled = true; b.textContent = "Saving...";
    var payload = { id: d.id, title: d.title.trim(), album: d.album, type: d.type, artist: d.artist, key: d.key, bpm: d.bpm, time: d.time, genre: d.genre, link: (d.link || "").trim(), lyrics: d.lyrics };
    send("savesong", state.pin, payload).then(function(r){
      if(r && r.ok){ state.sdraft = null; return load(true).then(function(){ location.hash = "#/c/" + encodeURIComponent(r.id); }); }
      b.disabled = false; b.textContent = id ? "Save changes" : "Add song";
      if(r && r.error === "wrong_pin") return wrongPin();
      msg(r && r.error === "exists" ? "Another song already has that title." : "Could not save (" + esc((r && r.error) || "unknown") + ").");
    }).catch(function(x){ b.disabled = false; b.textContent = id ? "Save changes" : "Add song"; msg("Could not reach the server (" + esc(x.message) + "). Your changes are still here; try again."); });
  };
  if($("sDel")) $("sDel").onclick = function(){
    if(!confirm('Delete "' + d.title + '" from the songbook? This removes it for everyone.')) return;
    jsonp(SCRIPT_URL + "?action=deletesong&pin=" + encodeURIComponent(state.pin) + "&id=" + encodeURIComponent(id)).then(function(r){
      if(r && r.ok){ state.sdraft = null; return load(true).then(function(){ location.hash = "#/songs"; }); }
      if(r && r.error === "wrong_pin") return wrongPin();
      msg("Could not delete (" + esc((r && r.error) || "unknown") + ").");
    });
  };
}

/* ---------- leader tools: albums, artists, genres, members ---------- */
function renderManage(banner){
  var db = state.db;
  function count(field, name){ return db.songs.filter(function(s){ return norm(s[field]) === norm(name); }).length; }
  function block(kind, title, items, field, extra){
    return '<div class="card block"><h2>' + title + ' <span class="muted" style="font-size:14px">(' + items.length + ')</span></h2>' +
      '<div class="addrow"><input id="add' + kind + '" placeholder="New ' + title.toLowerCase().replace(/s$/, "") + ' name">' + (extra || '') + '<button class="btn small primary" data-addk="' + kind + '">+ Add</button></div>' +
      items.map(function(it){ var name = it.name || it; return '<div class="mrow"><div style="flex:1;min-width:0"><b>' + esc(name) + '</b>' + (it.year ? ' <span class="muted">' + esc(it.year) + '</span>' : '') + ' <span class="muted" style="font-size:12px">· ' + count(field, name) + ' songs</span></div>' +
        '<button class="btn small" data-ren="' + kind + '" data-name="' + esc(name) + '">Rename</button><button class="btn small danger" data-del="' + kind + '" data-name="' + esc(name) + '">Delete</button></div>'; }).join("") + '</div>';
  }
  var h = banner + '<div class="pagehead"><h2>Leader tools</h2><button class="ibtn" id="mSignOut">Sign out</button></div><div id="mMsg"></div>' +
    '<div class="card block"><h2>Band members <span class="muted" style="font-size:14px">(' + (db.members || []).length + ')</span></h2>' +
    '<div class="addrow"><input id="addMembers" placeholder="Name"><input id="addInst" placeholder="Plays (e.g. guitar, vocals)"><button class="btn small primary" data-addk="Members">+ Add</button></div>' +
    (db.members || []).map(function(m){ return '<div class="mrow"><div style="flex:1;min-width:0"><b>' + esc(m.name) + '</b> <span class="muted">' + esc(m.instruments || "") + '</span></div>' +
      '<button class="btn small" data-medit="' + esc(m.id) + '">Edit</button><button class="btn small danger" data-mdel="' + esc(m.id) + '">Delete</button></div>'; }).join("") + '</div>' +
    block("Albums", "Albums", db.albums, "album", '<input id="addYear" placeholder="Year" style="max-width:90px" inputmode="numeric">') +
    block("Artists", "Artists", db.artists, "artist") +
    block("Genres", "Genres", db.genres, "genre");
  $("app").innerHTML = h; scrollTop();
  function op(data, okMsg){
    $("mMsg").innerHTML = '<div class="banner warn">Saving...</div>';
    send("listop", state.pin, data).then(function(r){
      if(r && r.ok) return load(true).then(function(){ renderManage(banner); $("mMsg").innerHTML = '<div class="banner ok">' + okMsg + '</div>'; });
      if(r && r.error === "wrong_pin") return wrongPin();
      if(r && r.error === "in_use"){
        if(confirm(r.count + " songs use this. Delete it anyway? Those songs will have it left blank.")) return op(Object.assign({}, data, { force: true }), okMsg);
        $("mMsg").innerHTML = ""; return;
      }
      $("mMsg").innerHTML = '<div class="banner bad">Could not save (' + esc((r && r.error) || "unknown") + ').</div>';
    }).catch(function(x){ $("mMsg").innerHTML = '<div class="banner bad">No internet (' + esc(x.message) + ').</div>'; });
  }
  $("mSignOut").onclick = signOut;
  document.querySelectorAll("[data-addk]").forEach(function(b){ b.onclick = function(){
    var k = b.getAttribute("data-addk"), name = $("add" + k).value.trim(); if(!name) return;
    var data = { kind: k, op: "add", name: name };
    if(k === "Members") data.instruments = $("addInst").value.trim();
    if(k === "Albums") data.year = $("addYear").value.trim();
    op(data, "Added " + name + ".");
  }; });
  document.querySelectorAll("[data-ren]").forEach(function(b){ b.onclick = function(){
    var k = b.getAttribute("data-ren"), old = b.getAttribute("data-name"), name = (prompt("New name for " + old + ":", old) || "").trim();
    if(!name || name === old) return;
    op({ kind: k, op: "rename", old: old, name: name }, "Renamed. Songs using it were updated too.");
  }; });
  document.querySelectorAll("[data-del]").forEach(function(b){ b.onclick = function(){
    var k = b.getAttribute("data-del"), old = b.getAttribute("data-name");
    if(!confirm("Delete " + old + "?")) return;
    op({ kind: k, op: "delete", old: old }, "Deleted " + old + ".");
  }; });
  document.querySelectorAll("[data-medit]").forEach(function(b){ b.onclick = function(){
    var m = db.members.filter(function(x){ return x.id === b.getAttribute("data-medit"); })[0]; if(!m) return;
    var name = prompt("Name:", m.name); if(name == null) return;
    var inst = prompt("Plays:", m.instruments || ""); if(inst == null) return;
    op({ kind: "Members", op: "update", id: m.id, name: name.trim(), instruments: inst.trim() }, "Saved " + name + ".");
  }; });
  document.querySelectorAll("[data-mdel]").forEach(function(b){ b.onclick = function(){
    var m = db.members.filter(function(x){ return x.id === b.getAttribute("data-mdel"); })[0];
    if(m && confirm("Remove " + m.name + " from the band list?")) op({ kind: "Members", op: "delete", id: m.id }, "Removed " + m.name + ".");
  }; });
}

/* ---------- help ---------- */
function helpHtml(){
  var S = state.db.songs;
  var noLyr = S.filter(function(s){ return !s.hasLyrics; }), noKey = S.filter(function(s){ return !s.key; }), noBpm = S.filter(function(s){ return !s.bpm; }), noGenre = S.filter(function(s){ return !s.genre; });
  function li(arr){ return arr.length ? '<ul>' + arr.slice().sort(byTitle).map(function(s){ return '<li><a href="#/c/' + encodeURIComponent(s.id) + '">' + esc(s.title) + '</a></li>'; }).join("") + '</ul>' : '<p class="muted">None.</p>'; }
  var h = '<div class="card block help"><h2>How to use the songbook</h2>' +
    '<p><button class="btn primary" id="hGuide">Show the quick guide</button></p>' +
    '<ul><li><b>Home</b> shows the next event. Tap <b>▶ Start</b> to go through the set list song by song. Swipe left or right to change songs.</li>' +
    '<li><b>Songs</b>: search by title or by any line of the lyrics. Tap ♡ to save a song to your own list.</li>' +
    '<li>In a song, <b>Options</b> lets you change the key, hide chords, make the text bigger, use the metronome and keep the screen on. Changes stay on your phone only.</li>' +
    '<li><b>▶ Listen</b> opens the practice recording when the song has one.</li>' +
    '<li><b>//</b> means sing those lines twice, <b>///</b> three times.</li>' +
    '<li><b>Events</b>: each one has its set list. Tap <b>Share</b> to send it to the band on WhatsApp.</li></ul></div>';
  var mem = state.db.members || [];
  if(mem.length) h += '<div class="card block help"><h2>The band</h2><div class="players">' + mem.map(function(m){ return '<span><b>' + esc(m.name) + '</b> ' + esc(m.instruments || "") + '</span>'; }).join("") + '</div></div>';
  h += '<div class="card block help"><h2>Band leaders</h2>' + (leader() ? '<p>You are signed in as a leader on this phone. You can add and edit songs and events, and manage albums, artists, genres and members.</p><p><a class="btn" href="#/manage">Leader tools</a> <button class="btn" id="hOut">Sign out</button></p>' :
    '<p>Leaders can add and change songs, events and lists. Sign in once with the band PIN.</p><p><a class="btn" href="#/manage">Leader sign-in</a></p>') + '</div>';
  if(leader()) h += '<div class="card block miss"><h2>What\'s missing in the songbook</h2><h3>No lyrics (' + noLyr.length + ')</h3>' + li(noLyr) + '<h3>No key (' + noKey.length + ')</h3>' + li(noKey) +
    '<h3>No tempo (' + noBpm.length + ')</h3>' + li(noBpm) + '<h3>No genre (' + noGenre.length + ')</h3>' + li(noGenre) + '</div>';
  return h;
}
function bindHelp(){
  if($("hGuide")) $("hGuide").onclick = function(){ showGuide(0); };
  if($("hOut")) $("hOut").onclick = signOut;
}

/* ---------- first-run guide (English / Spanish) + install help ---------- */
var GUIDE = {
  en: { title: ["Put the app on your phone", "Open the next event", "Play song by song"],
        next: "Next", done: "Got it", lang: "Español",
        install: "Install now",
        android: "On Android: open this page in <b>Chrome</b>, tap the <b>⋮ menu</b> at the top right, then <b>Add to Home screen</b> (or <b>Install app</b>).",
        iphone: "On iPhone: open this page in <b>Safari</b>, tap the <b>Share</b> button (square with an arrow), then <b>Add to Home Screen</b>.",
        s2: "The <b>Home</b> page always shows the next service or event. Tap <b>▶ Start</b> to open its set list.",
        s3: "<b>Swipe left</b> for the next song, <b>swipe right</b> to go back. Tap <b>Options</b> in a song for bigger text or a different key. The screen stays on while you play." },
  es: { title: ["Ponga la app en su teléfono", "Abra el próximo evento", "Toque canción por canción"],
        next: "Siguiente", done: "Listo", lang: "English",
        install: "Instalar ahora",
        android: "En Android: abra esta página en <b>Chrome</b>, toque el <b>menú ⋮</b> arriba a la derecha y luego <b>Agregar a la pantalla principal</b> (o <b>Instalar app</b>).",
        iphone: "En iPhone: abra esta página en <b>Safari</b>, toque <b>Compartir</b> (el cuadro con una flecha) y luego <b>Agregar a inicio</b>.",
        s2: "La página de <b>Inicio</b> siempre muestra el próximo servicio o evento. Toque <b>▶ Start</b> para abrir la lista de canciones.",
        s3: "<b>Deslice a la izquierda</b> para la siguiente canción y <b>a la derecha</b> para regresar. Toque <b>Options</b> en una canción para letra más grande o cambiar el tono. La pantalla se queda encendida mientras toca." }
};
function showGuide(step){
  var g = GUIDE[state.lang] || GUIDE.en, ua = navigator.userAgent, ios = /iPhone|iPad|iPod/i.test(ua), android = /Android/i.test(ua);
  var body = step === 0 ? (isInstalled() ? '<p>✓ ' + (state.lang === "es" ? "Ya está instalada en este teléfono." : "It's already installed on this phone.") + '</p>' :
      (state.installEvt ? '<p><button class="btn primary big" id="gInstall">' + g.install + '</button></p>' : '') + (ios ? '<p>' + g.iphone + '</p>' : android ? '<p>' + g.android + '</p>' : '<p>' + g.android + '</p><p>' + g.iphone + '</p>'))
    : step === 1 ? '<p>' + g.s2 + '</p>' : '<p>' + g.s3 + '</p>';
  var ov = $("guide") || document.body.appendChild(Object.assign(document.createElement("div"), { id: "guide" }));
  ov.className = "guide";
  ov.innerHTML = '<div class="guide-card"><div class="guide-top"><span class="muted">' + (step + 1) + ' / 3</span><button class="btn small" id="gLang">' + g.lang + '</button></div>' +
    '<h2>' + g.title[step] + '</h2>' + body +
    '<div class="guide-dots">' + [0,1,2].map(function(i){ return '<i class="' + (i === step ? 'on' : '') + '"></i>'; }).join("") + '</div>' +
    '<button class="btn primary big" id="gNext">' + (step < 2 ? g.next : g.done) + '</button></div>';
  $("gNext").onclick = function(){ if(step < 2) showGuide(step + 1); else { ls("guideDone", true); ov.remove(); } };
  $("gLang").onclick = function(){ state.lang = state.lang === "es" ? "en" : "es"; ls("lang", state.lang); showGuide(step); };
  if($("gInstall")) $("gInstall").onclick = function(){ var e = state.installEvt; state.installEvt = null; e.prompt(); e.userChoice.then(function(){ showGuide(0); }); };
  ov.onclick = function(e){ if(e.target === ov){ ls("guideDone", true); ov.remove(); } };
}

/* keep the page bottom clear of the bottom bar (its height changes with phone text size) */
function fitBottom(){
  var nav = $("tabsBottom"), bar = document.querySelector(".setnav.fixed");
  if(nav && nav.offsetHeight) document.documentElement.style.setProperty("--navh", nav.offsetHeight + "px");
  if(bar && bar.offsetHeight) document.documentElement.style.setProperty("--stageh", bar.offsetHeight + "px");
}
window.addEventListener("resize", fitBottom);
window.addEventListener("hashchange", function(){ setTimeout(fitBottom, 50); });
setTimeout(fitBottom, 300);
/* ---------- start ---------- */
var c = ls("cache2");
if(SCRIPT_URL && c && c.data){ try{ useData(c.data, "cache", c.at); }catch(e){} }
load(false);
if(!state.db) route();
if("serviceWorker" in navigator && location.protocol === "https:"){ navigator.serviceWorker.register("sw.js").catch(function(){}); }
})();
